[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-demo"
version = "1.0.0"
description = "Python 调试、测试与代码规范最佳实践示例项目"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Demo Author" }]
keywords = ["calculator", "testing", "debugging", "best-practices"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["0824"]

# ======================================================================
# pytest 配置
# ======================================================================

[tool.pytest.ini_options]
minversion = "7.0"
# 测试路径与 Python 路径
testpaths = ["tests"]
pythonpath = ["0824"]
# 输出格式：显示最慢的 N 个测试，帮助定位慢测试
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
# 注册自定义 marker，避免 --strict-markers 报错
markers = [
    "slow: 标记耗时较长的测试",
    "integration: 标记集成测试",
]

# ======================================================================
# ruff 配置（代码风格 + import 排序 + 静态分析）
# 替代 flake8 + isort + pyupgrade，速度更快
# ======================================================================

[tool.ruff]
target-version = "py310"
line-length = 88  # PEP 8 建议 79，black 默认 88
src = ["0824", "tests", "examples"]

[tool.ruff.lint]
# 启用的规则集：
# E/W  - pycodestyle（PEP 8 风格）
# F    - pyflakes（未使用变量/导入）
# I    - isort（import 排序）
# UP   - pyupgrade（现代语法升级）
# B    - flake8-bugbear（常见 bug 检测）
# SIM  - flake8-simplify（简化代码）
# RUF  - ruff 自带规则
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# 忽略的规则
ignore = [
    "E501",  # 行长度由 formatter 控制，linter 不重复检查
    "B008",  # 函数参数中使用表达式（如 default=[]）在某些场景合理
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许一些宽松规则
"tests/**/*.py" = ["B011", "S101"]  # 测试中允许 assert
"examples/**/*.py" = ["T201"]  # 示例中允许 print

[tool.ruff.format]
# 与 black 兼容的格式化
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ======================================================================
# mypy 配置（静态类型检查）
# ======================================================================

[tool.mypy]
python_version = "3.10"
# 严格模式：开启所有类型检查
strict = true
# 检查未类型化的函数体
warn_unused_ignores = true
warn_redundant_casts = true
# 输出
show_error_codes = true
show_column_numbers = true
color_output = true

[[tool.mypy.overrides]]
# 测试文件放宽类型要求
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# 示例脚本放宽类型要求
module = "examples.*"
disallow_untyped_defs = false

# ======================================================================
# coverage 配置（pytest-cov）
# ======================================================================

[tool.coverage.run]
source = ["0824/calculator"]
branch = true  # 统计分支覆盖率

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80  # 覆盖率低于 80% 时测试失败
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
